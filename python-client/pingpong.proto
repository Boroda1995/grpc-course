syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.galdovich.pingpong";
option java_outer_classname = "PingPongProto";

package pingpong;

service PingPongService {
  rpc Ping (PingRequest) returns (PongResponse) {}
}

message PingRequest {
  string message = 1;
}

message PongResponse {
  string message = 1;
}